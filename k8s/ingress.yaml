apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trades-dashboard
  namespace: trades-dashboard
  labels:
    app.kubernetes.io/name: trades-dashboard
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: trades.local
      http:
        paths:
          # Запросы к бэкенду (/api, /health, /ready)
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /(health|ready)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8000
          # Все остальные запросы на фронтенд
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 80
