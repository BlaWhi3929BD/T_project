name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r solution/backend/requirements.txt pytest httpx ruff

      - name: Generate deterministic dataset
        run: python task/data/seed.py

      - name: Run Ruff checks
        run: |
          ruff check solution/backend
          ruff format --check solution/backend

      - name: Run backend tests
        env:
          PYTHONPATH: solution/backend
          CSV_PATH: ${{ github.workspace }}/task/data/trades.csv
        run: pytest -q solution/backend/tests

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trades_test
          POSTGRES_USER: trades_user
          POSTGRES_PASSWORD: trades_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trades_user -d trades_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r solution/backend/requirements.txt pytest httpx

      - name: Generate deterministic dataset
        run: python task/data/seed.py

      - name: Run backend tests on PostgreSQL
        env:
          PYTHONPATH: solution/backend
          CSV_PATH: ${{ github.workspace }}/task/data/trades.csv
          DATABASE_URL: postgresql+psycopg2://trades_user:trades_password@127.0.0.1:5432/trades_test
          PARITY_DATABASE_URL: postgresql+psycopg2://trades_user:trades_password@127.0.0.1:5432/trades_test
        run: pytest -q solution/backend/tests/test_api.py solution/backend/tests/test_crud.py

      - name: Run SQLite/PostgreSQL parity tests
        env:
          PYTHONPATH: solution/backend
          PARITY_DATABASE_URL: postgresql+psycopg2://trades_user:trades_password@127.0.0.1:5432/trades_test
        run: pytest -q solution/backend/tests/test_database_parity.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solution/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: solution/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs:
      - backend-sqlite
      - backend-postgres
      - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag trades-backend:${{ github.sha }} -f solution/backend/Dockerfile .

      - name: Build frontend image
        run: docker build --tag trades-frontend:${{ github.sha }} -f solution/frontend/Dockerfile solution/frontend

      - name: Enforce image size limits
        run: |
          backend_size=$(docker image inspect trades-backend:${{ github.sha }} --format '{{.Size}}')
          frontend_size=$(docker image inspect trades-frontend:${{ github.sha }} --format '{{.Size}}')
          test "$backend_size" -le 524288000
          test "$frontend_size" -le 62914560

  compose-integration:
    runs-on: ubuntu-latest
    needs:
      - backend-sqlite
      - backend-postgres
      - frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create CI Compose environment
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_DB=trades_ci
          POSTGRES_USER=trades_ci
          POSTGRES_PASSWORD=ci-only-password
          DATABASE_URL=******postgres:5432/trades_ci
          EOF

      - name: Validate Compose configuration
        run: docker compose --env-file .env.ci config --quiet

      - name: Start the Compose stack
        run: docker compose --env-file .env.ci up --build -d

      - name: Wait for healthy runtime services
        run: |
          set -eu
          for attempt in $(seq 1 120); do
            postgres_health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' trades-postgres 2>/dev/null || true)
            backend_health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' trades-backend 2>/dev/null || true)
            frontend_health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' trades-frontend 2>/dev/null || true)
            if [ "$postgres_health" = healthy ] && [ "$backend_health" = healthy ] && [ "$frontend_health" = healthy ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose --env-file .env.ci ps
          docker compose --env-file .env.ci logs --no-color
          exit 1

      - name: Verify dashboard, API, and runtime isolation
        run: |
          set -eu
          curl --fail --silent http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl --fail --silent http://127.0.0.1:8080/health | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:8080/ready | grep -q '"status":"ready"'
          curl --fail --silent http://127.0.0.1:8080/api/stats > /tmp/stats.json
          python - <<'PY'
          import json
          from pathlib import Path

          stats = json.loads(Path("/tmp/stats.json").read_text())
          assert stats["trades_count"] == 100000
          assert stats["net_pnl"] == "20373.96"
          PY
          ! curl --silent --connect-timeout 2 http://127.0.0.1:8000/
          test "$(docker compose --env-file .env.ci exec -T backend id -u)" != "0"

      - name: Verify repeat startup preserves the dataset
        run: |
          set -eu
          docker compose --env-file .env.ci down
          docker compose --env-file .env.ci up -d
          for attempt in $(seq 1 120); do
            backend_health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' trades-backend 2>/dev/null || true)
            frontend_health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' trades-frontend 2>/dev/null || true)
            if [ "$backend_health" = healthy ] && [ "$frontend_health" = healthy ]; then
              break
            fi
            sleep 5
          done
          curl --fail --silent http://127.0.0.1:8080/api/stats > /tmp/repeat-stats.json
          python - <<'PY'
          import json
          from pathlib import Path

          stats = json.loads(Path("/tmp/repeat-stats.json").read_text())
          assert stats["trades_count"] == 100000
          assert stats["net_pnl"] == "20373.96"
          PY
          docker compose --env-file .env.ci logs --no-color backend | grep -q "Skipping seed"

      - name: Tear down Compose stack
        if: always()
        run: docker compose --env-file .env.ci down -v --remove-orphans

  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s/ > /tmp/trades-dashboard-manifests.yaml

      - name: Check rendered resources
        run: |
          grep -q 'kind: StatefulSet' /tmp/trades-dashboard-manifests.yaml
          grep -q 'kind: Deployment' /tmp/trades-dashboard-manifests.yaml
          grep -q 'startupProbe:' /tmp/trades-dashboard-manifests.yaml
          ! grep -Eq 'image: trades-(backend|frontend):latest([[:space:]]|$)' /tmp/trades-dashboard-manifests.yaml
          ! grep -q '^kind: Job$' /tmp/trades-dashboard-manifests.yaml
          ! grep -q 'POSTGRES_PASSWORD: "123"' /tmp/trades-dashboard-manifests.yaml
