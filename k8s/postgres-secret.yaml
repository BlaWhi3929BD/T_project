apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: trades-dashboard
  labels:
    app.kubernetes.io/name: trades-dashboard
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Шаблонные значения для манифеста по умолчанию
  # В продакшене переопределяется через kubectl create secret / kustomize secretGenerator
  POSTGRES_DB: "trades_db"
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "123"
  DATABASE_URL: "postgresql://user:123@postgres:5432/trades_db"
