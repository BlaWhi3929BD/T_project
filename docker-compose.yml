services:
  postgres:
    image: postgres:16-alpine
    container_name: trades-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trades_db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-trades_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  backend-test:
    build:
      context: .
      dockerfile: solution/backend/Dockerfile
      target: test
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:123@postgres:5432/trades_db}
    depends_on:
      postgres:
        condition: service_healthy

  # Инициализация базы данных: выполняется один раз при первом запуске
  db-seed:
    build:
      context: .
      dockerfile: solution/backend/Dockerfile
    container_name: trades-db-seed
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:123@postgres:5432/trades_db}
    # Используем --if-empty для того, чтобы при повторном запуске данные не перезаписывались и не стирались
    command: python scripts/seed_db.py --if-empty
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: solution/backend/Dockerfile
    container_name: trades-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://user:123@postgres:5432/trades_db}
    depends_on:
      postgres:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./solution/frontend
      dockerfile: Dockerfile
    container_name: trades-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
