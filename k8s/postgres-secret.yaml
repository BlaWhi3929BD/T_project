apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: trades-dashboard
  labels:
    app.kubernetes.io/name: trades-dashboard
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Replace these placeholders with values supplied outside of git before deployment.
  POSTGRES_DB: "trades_db"
  POSTGRES_USER: "trades_user"
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgresql://trades_user:change-me@postgres:5432/trades_db"
